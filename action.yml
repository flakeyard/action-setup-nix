name: Set up Nix
description: >-
  Installs a pinned Nix in multi-user mode with the sandbox on, on GitHub-hosted
  Linux runners.
inputs:
  extra-substituters:
    description: >-
      Binary caches to use besides cache.nixos.org: https URLs separated by
      whitespace.
    default: ""
  extra-trusted-public-keys:
    description: >-
      Public keys of the extra caches, such as name-1:<base64>, separated by
      whitespace.
    default: ""
  github-token:
    description: >-
      Token for fetching from GitHub, against API rate limits. Empty disables
      it.
    default: ${{ github.token }}
outputs:
  nix-version:
    description: Installed Nix version, as X.Y.Z.
    value: ${{ steps.verify.outputs.nix-version }}
# The library step comes first: it fails on every runner but a GitHub-hosted
# Linux runner on X64 or ARM64, before any step that needs /usr/bin/bash. The
# other steps use the runner's bash in privileged mode (-p), which reads no
# BASH_ENV and imports no functions or shell options, and the run-step.sh of
# the library gives each script only the variables named in its run line, so
# that earlier steps of the job cannot inject code through them. Variables of
# the dynamic loader, such as LD_PRELOAD, still reach the first bash of every
# step: GitHub does not block them.
runs:
  using: composite
  steps:
    - id: lib
      uses: flakeyard/action-shell-lib@d2f4905ffa8bcea6bb6be2928d90db9037d5bdef # v0.3.0

    - name: Check the runner and inputs
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        SUBSTITUTERS: ${{ inputs.extra-substituters }}
        KEYS: ${{ inputs.extra-trusted-public-keys }}
        TOKEN: ${{ inputs.github-token }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" check SUBSTITUTERS KEYS TOKEN HOME
        XDG_CONFIG_HOME PATH

    - name: Install Nix
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        SUBSTITUTERS: ${{ inputs.extra-substituters }}
        KEYS: ${{ inputs.extra-trusted-public-keys }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" install SUBSTITUTERS KEYS RUNNER_ARCH
        RUNNER_TEMP GITHUB_PATH HOME

    - name: Configure the GitHub token
      if: inputs.github-token != ''
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        TOKEN: ${{ inputs.github-token }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" configure-token TOKEN HOME
        XDG_CONFIG_HOME

    - id: verify
      name: Check the installation
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ steps.lib.outputs.path }}
        SUBSTITUTERS: ${{ inputs.extra-substituters }}
        KEYS: ${{ inputs.extra-trusted-public-keys }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" verify SUBSTITUTERS KEYS
        GITHUB_OUTPUT HOME
