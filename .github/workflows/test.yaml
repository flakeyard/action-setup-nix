# CI of this repository: unit tests of the scripts, and the action itself on
# every supported runner, then workflow-check over all of them. Weekly,
# because runner image updates can break the action without a release.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The library that the steps use, at the commit that action.yml pins.
      - id: lib
        uses: flakeyard/action-shell-lib@3bad257f744402ce4627954c4250171150ffb54d # v0.1.1
      - env:
          SHELL_LIB: ${{ steps.lib.outputs.path }}
        run: tests/run.sh

  pinned:
    name: Pinned release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks the pinned tarballs against the signed store paths of
      # cache.nixos.org; fails if versions.sh would change.
      - run: tests/ci/pinned/check.sh
      # Updates a copy from the previous Nix release, as a maintainer would.
      - run: tests/ci/pinned/update.sh

  install:
    name: Install on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: $/
        with:
          extra-substituters: https://flakeyard.cachix.org
          extra-trusted-public-keys: flakeyard.cachix.org-1:WxHxE1HWLr67hdqhOBRrfWAM408yL6SM3g9++ZaaSzg=

      - name: Check the installation
        env:
          NIX_VERSION: ${{ steps.setup.outputs.nix-version }}
          EXTRA_SUBSTITUTER: https://flakeyard.cachix.org
        run: tests/ci/install/check.sh

      - name: Record the configuration
        run: >-
          sha256sum /etc/nix/nix.conf ~/.config/nix/nix.conf
          >"$RUNNER_TEMP/nix.conf.sha256"

      - id: again
        name: Run the action again
        continue-on-error: true
        uses: $/

      - name: Check that the second run failed and changed nothing
        env:
          OUTCOME: ${{ steps.again.outcome }}
        run: |
          [[ $OUTCOME == failure ]] || { echo "::error::The second run did not fail."; exit 1; }
          sha256sum --check "$RUNNER_TEMP/nix.conf.sha256"

  without-token:
    name: Install without a token
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          github-token: ""
      - run: tests/ci/without-token/check.sh

  invalid-token:
    name: Install with an invalid token
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          github-token: ghs_invalid0000000000000000000000000000
      - run: tests/ci/invalid-token/check.sh

  hostile-environment:
    name: Install in a hostile job environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASH_ENV: ${{ github.workspace }}/tests/ci/hostile-environment/bash-env
      NIX_CONFIG: sandbox = false
      NIX_USER_COUNT: "1"
      NIX_BUILD_GROUP_ID: "12345"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export functions and shell options
        run: tests/ci/hostile-environment/github-env.sh
      # Last before the action: bash and env on PATH are fakes from here on.
      - name: Put fake tools first on PATH
        run:
          echo "$GITHUB_WORKSPACE/tests/ci/hostile-environment/bin"
          >>"$GITHUB_PATH"
      - uses: $/
      - name: Check the installation
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: /usr/bin/bash tests/ci/hostile-environment/check.sh

  rejected:
    name: Reject ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: an invalid input
            runner: ubuntu-24.04
            substituters: https://cache.example.org?trusted=1
          - case: macOS
            # Any macOS rejects; Intel because arm64 runners often wait for
            # capacity until the job times out.
            runner: macos-15-intel
            substituters: ""
          - case: Windows
            runner: windows-latest
            substituters: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        continue-on-error: true
        uses: $/
        with:
          extra-substituters: ${{ matrix.substituters }}
      - env:
          OUTCOME: ${{ steps.setup.outcome }}
        shell: bash
        run: tests/ci/rejected/check.sh

  container:
    name: Reject a container job
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        continue-on-error: true
        uses: $/
      # Checked like the runners of the rejected job.
      - env:
          OUTCOME: ${{ steps.setup.outcome }}
        shell: bash
        run: tests/ci/rejected/check.sh

  check:
    needs:
      [
        unit,
        pinned,
        install,
        without-token,
        invalid-token,
        hostile-environment,
        rejected,
        container,
      ]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@0a6da024486758d1f58cccd277e3a18021f3fb0c # v0.1.2
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      # No flake yet: the checks of the atoms run locally (README, Bootstrap).
      flake: ""
      renovate-presets: '["flakeyard/renovate-config"]'
