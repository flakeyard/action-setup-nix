# Runs OpenSSF Scorecard for this repository with flakeyard/workflow-scorecard.
name: scorecard

on:
  push:
    branches: [main] # the default branch
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: flakeyard/workflow-scorecard/.github/workflows/scorecard.yaml@f9eb86263d345c576c05996dcfc7da255b9f2676 # v0.1.1
    permissions:
      actions: read # workflow runs, needed in private repositories
      contents: read # checkout and the repository through the API
      id-token: write # signs the published results
      security-events: write # uploads the results to code scanning
